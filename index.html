<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIANIME | Stream Your Favorite Anime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ffbade;
            --bg-dark: #0a0a0a;
            --bg-card: #121212;
            --bg-glass: rgba(18, 18, 18, 0.8);
        }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 186, 222, 0.1);
        }
        .text-accent { color: var(--accent); }
        .bg-accent { background-color: var(--accent); }
        .border-accent { border-color: var(--accent); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-gradient {
            background: linear-gradient(0deg, var(--bg-dark) 0%, rgba(10,10,10,0) 100%);
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="fixed top-0 w-full z-50 glass">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <h1 class="text-2xl font-bold tracking-tighter text-accent cursor-pointer" onclick="navigate('home')">TRIANIME</h1>
                <div class="hidden md:flex gap-6 text-sm font-medium">
                    <button onclick="navigate('home')" class="hover:text-accent transition">Home</button>
                    <button onclick="navigate('browse')" class="hover:text-accent transition">Browse</button>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="relative hidden sm:block">
                    <input type="text" id="searchInput" placeholder="Search anime..." 
                           class="bg-[#1e1e1e] border border-white/10 rounded-full px-4 py-1.5 text-sm focus:outline-none focus:border-accent w-64">
                </div>
                <button onclick="handleSearch()" class="p-2 hover:bg-white/10 rounded-full sm:hidden">
                    🔍
                </button>
            </div>
        </div>
    </nav>

    <main id="app" class="pt-16 min-h-screen">
        </main>

    <footer class="mt-20 py-10 border-t border-white/5 text-center text-gray-500 text-sm">
        <p>&copy; 2024 TRIANIME. Data powered by Jikan API.</p>
    </footer>

    <script>
        /** * STATE & CONSTANTS 
         */
        const state = {
            view: 'home', // home, browse, watch, search
            data: {
                hero: [],
                trending: [],
                upcoming: [],
                searchResults: [],
                currentAnime: null
            },
            filters: {
                page: 1,
                genre: null,
                query: ''
            }
        };

        const GENRES = [
            { id: 1, name: 'Action' }, { id: 2, name: 'Adventure' }, { id: 4, name: 'Comedy' },
            { id: 8, name: 'Drama' }, { id: 10, name: 'Fantasy' }, { id: 22, name: 'Romance' },
            { id: 24, name: 'Sci-Fi' }, { id: 36, name: 'Slice of Life' }, { id: 37, name: 'Supernatural' }
        ];

        const API_BASE = "https://api.jikan.moe/v4";

        /** * CORE LOGIC 
         */
        async function init() {
            renderLoading();
            try {
                // Sequential fetching to avoid 429 Rate Limits
                const heroRes = await fetch(`${API_BASE}/seasons/now?limit=5`);
                state.data.hero = (await heroRes.json()).data || [];
                await delay(500);

                const trendRes = await fetch(`${API_BASE}/top/anime?filter=airing&limit=12`);
                state.data.trending = (await trendRes.json()).data || [];
                await delay(500);

                const upRes = await fetch(`${API_BASE}/seasons/upcoming?limit=10`);
                state.data.upcoming = (await upRes.json()).data || [];

                renderHome();
            } catch (err) {
                console.error("Fetch Error:", err);
                // Fallback attempt
                const fallback = await fetch(`${API_BASE}/top/anime?page=2`);
                state.data.trending = (await fallback.json()).data;
                renderHome();
            }
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        function navigate(view, params = {}) {
            state.view = view;
            window.scrollTo(0, 0);
            if (view === 'home') renderHome();
            if (view === 'browse') fetchBrowse();
            if (view === 'watch') fetchWatchDetails(params.id);
            if (view === 'search') fetchSearch(params.query);
        }

        /** * API FUNCTIONS 
         */
        async function fetchBrowse() {
            renderLoading();
            const genreParam = state.filters.genre ? `&genres=${state.filters.genre}` : '';
            const res = await fetch(`${API_BASE}/anime?page=${state.filters.page}${genreParam}&order_by=score&sort=desc`);
            const data = await res.json();
            renderBrowse(data.data, data.pagination);
        }

        async function fetchSearch(query) {
            renderLoading();
            const res = await fetch(`${API_BASE}/anime?q=${query}&limit=20`);
            const data = await res.json();
            renderSearch(data.data, query);
        }

        async function fetchWatchDetails(id) {
            renderLoading();
            const res = await fetch(`${API_BASE}/anime/${id}/full`);
            const data = await res.json();
            state.data.currentAnime = data.data;
            renderWatch();
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value;
            if(q) navigate('search', { query: q });
        }

        /** * RENDERERS 
         */
        function renderLoading() {
            document.getElementById('app').innerHTML = `
                <div class="h-screen flex items-center justify-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-accent"></div>
                </div>
            `;
        }

        function renderHome() {
            const hero = state.data.hero[0] || state.data.trending[0];
            
            let html = `
                <section class="relative h-[70vh] w-full overflow-hidden fade-in">
                    <img src="${hero.images.jpg.large_image_url}" class="absolute inset-0 w-full h-full object-cover object-top opacity-40">
                    <div class="absolute inset-0 hero-gradient"></div>
                    <div class="relative max-w-7xl mx-auto px-4 h-full flex flex-col justify-center items-start">
                        <span class="text-accent font-bold mb-2 tracking-widest uppercase text-xs">Featured Spotlight</span>
                        <h2 class="text-4xl md:text-6xl font-bold mb-4 max-w-2xl">${hero.title}</h2>
                        <p class="text-gray-300 max-w-xl line-clamp-2 mb-6">${hero.synopsis}</p>
                        <button onclick="navigate('watch', {id: ${hero.mal_id}})" class="bg-accent text-black px-8 py-3 rounded-md font-bold hover:brightness-110 transition">WATCH NOW</button>
                    </div>
                </section>

                <div class="max-w-7xl mx-auto px-4 grid grid-cols-12 gap-8 mt-12">
                    <div class="col-span-12 lg:col-span-9">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold border-l-4 border-accent pl-3">Latest Airing</h3>
                            <button onclick="navigate('browse')" class="text-sm text-gray-400 hover:text-accent">View All</button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                            ${state.data.trending.map(anime => cardTemplate(anime)).join('')}
                        </div>
                    </div>

                    <div class="col-span-12 lg:col-span-3 space-y-8">
                        <div>
                            <h3 class="text-lg font-bold mb-4 text-accent">Genres</h3>
                            <div class="flex flex-wrap gap-2">
                                ${GENRES.map(g => `<button onclick="state.filters.genre=${g.id}; navigate('browse')" class="px-3 py-1 bg-[#1e1e1e] hover:bg-accent hover:text-black text-xs rounded transition">${g.name}</button>`).join('')}
                            </div>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold mb-4">Upcoming</h3>
                            <div class="space-y-4">
                                ${state.data.upcoming.slice(0, 5).map(anime => `
                                    <div class="flex gap-3 cursor-pointer group" onclick="navigate('watch', {id: ${anime.mal_id}})">
                                        <img src="${anime.images.jpg.small_image_url}" class="w-16 h-20 object-cover rounded">
                                        <div>
                                            <h4 class="text-sm font-semibold group-hover:text-accent transition line-clamp-1">${anime.title}</h4>
                                            <p class="text-xs text-gray-500 mt-1">${anime.type} • ${anime.score || 'N/A'}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        function renderBrowse(list, pagination) {
            let html = `
                <div class="max-w-7xl mx-auto px-4 py-8 fade-in">
                    <h2 class="text-3xl font-bold mb-8">Browse Library</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
                        ${list.map(anime => cardTemplate(anime)).join('')}
                    </div>
                    <div class="flex justify-center gap-4 mt-12">
                        <button onclick="state.filters.page--; fetchBrowse()" ${state.filters.page === 1 ? 'disabled' : ''} class="px-6 py-2 bg-[#1e1e1e] rounded disabled:opacity-50">Prev</button>
                        <span class="py-2">Page ${state.filters.page}</span>
                        <button onclick="state.filters.page++; fetchBrowse()" class="px-6 py-2 bg-[#1e1e1e] rounded">Next</button>
                    </div>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        function renderSearch(list, query) {
            let html = `
                <div class="max-w-7xl mx-auto px-4 py-8 fade-in">
                    <h2 class="text-2xl font-bold mb-8">Results for: <span class="text-accent">"${query}"</span></h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
                        ${list.map(anime => cardTemplate(anime)).join('')}
                    </div>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        function renderWatch() {
            const anime = state.data.currentAnime;
            const videoUrl = anime.trailer?.embed_url ? anime.trailer.embed_url : "https://www.youtube.com/embed/dQw4w9WgXcQ";

            let html = `
                <div class="max-w-7xl mx-auto px-4 py-8 fade-in">
                    <div class="grid grid-cols-12 gap-8">
                        <div class="col-span-12 lg:col-span-8">
                            <div class="aspect-video bg-black rounded-xl overflow-hidden border border-white/5 shadow-2xl">
                                <iframe id="mainPlayer" src="${videoUrl}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                            </div>
                            <div class="mt-6">
                                <h1 class="text-3xl font-bold text-accent">${anime.title}</h1>
                                <div class="flex flex-wrap gap-4 mt-4 text-sm text-gray-400">
                                    <span>⭐ ${anime.score}</span>
                                    <span>📅 ${anime.year || 'N/A'}</span>
                                    <span>🎬 ${anime.studios[0]?.name || 'Unknown'}</span>
                                    <span class="uppercase border border-accent/30 px-2 rounded text-[10px] text-accent">${anime.status}</span>
                                </div>
                                <p class="mt-6 text-gray-300 leading-relaxed">${anime.synopsis}</p>
                            </div>
                        </div>

                        <div class="col-span-12 lg:col-span-4">
                            <div class="bg-[#121212] rounded-xl p-6 border border-white/5">
                                <h3 class="font-bold mb-4">Episodes</h3>
                                <div class="grid grid-cols-4 gap-2 overflow-y-auto max-h-[400px] pr-2">
                                    ${Array.from({length: anime.episodes || 12}, (_, i) => `
                                        <button onclick="simulatePlay(${i+1})" class="py-3 bg-[#1e1e1e] hover:bg-accent hover:text-black rounded text-xs font-bold transition">
                                            ${i+1}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        function cardTemplate(anime) {
            return `
                <div class="group cursor-pointer" onclick="navigate('watch', {id: ${anime.mal_id}})">
                    <div class="relative aspect-[3/4] overflow-hidden rounded-lg mb-3">
                        <img src="${anime.images.jpg.large_image_url}" class="w-full h-full object-cover transition duration-500 group-hover:scale-110">
                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur text-[10px] px-2 py-1 rounded font-bold">
                            ${anime.type}
                        </div>
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                             <div class="w-12 h-12 bg-accent rounded-full flex items-center justify-center text-black">▶</div>
                        </div>
                    </div>
                    <h4 class="text-sm font-bold line-clamp-1 group-hover:text-accent transition">${anime.title}</h4>
                    <p class="text-xs text-gray-500 mt-1">${anime.episodes ? anime.episodes + ' Episodes' : 'Ongoing'}</p>
                </div>
            `;
        }

        function simulatePlay(ep) {
            alert(`Now playing Episode ${ep} (Simulation)`);
            const player = document.getElementById('mainPlayer');
            player.src = player.src; // Just reloads the "stream"
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', init);
        
        // Search listener for Enter key
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') handleSearch();
        });
    </script>
</body>
  </html>
